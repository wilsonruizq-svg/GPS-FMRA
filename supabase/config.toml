# GPS-FMRA — configuración local mínima de Supabase CLI.
# Proyecto remoto: dgmzewsxbnwxjpnrtgyb
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "gps-fmra"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
